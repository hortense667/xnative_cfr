      console.log('同期開始 - ローカルeraSettings:', eraSettings);
      console.log('同期開始 - リモートSHA:', remoteSha);
      console.log('同期開始 - リモートタイムスタンプ:', timestamp);

      // 2. 要注意モードかどうかを判定
      const cautionMode = isCautionMode(timestamp);
      console.log('同期モード:', cautionMode ? '要注意モード' : '通常モード');

      // 3. 順序変更フラグをチェック
      const localData = events;
      let mergeResult;
      
      if (getOrderChanged()) {
        // 順序変更がある場合は、ローカルの順序を強制反映してフラグをオフ
        console.log('順序変更が検出されたため、ローカルの順序を強制反映');
        setOrderChanged(false); // フラグをオフ
        mergeResult = { merged: localData, conflicts: [] };
      } else if (cautionMode) {
        // 要注意モードでの同期処理
        mergeResult = performCautionModeSync(localData, remoteData);
      } else {
        // 通常モードでの同期処理
        mergeResult = performNormalModeSync(localData, remoteData);
      }
      
      const merged = mergeResult.merged;
      const conflicts = mergeResult.conflicts;

      // マージ後データの削除フラグ付き項目をチェック
      let mergedDeletedItems = [];
      for (const year of Object.keys(merged)) {
        const items = merged[year] || [];
        for (const item of items) {
          if (item.deleted === true) {
            mergedDeletedItems.push({ year, label: item.label, deleted: item.deleted });
          }
        }
      }
      
      console.log('同期完了 - マージ後データ:', merged);
      console.log('同期完了 - マージ後削除フラグ付き項目:', mergedDeletedItems);
      console.log('同期完了 - 競合情報:', conflicts);
      console.log('マージ後データサイズ:', JSON.stringify(merged).length, 'bytes');

      // 3. eraSettingsのマージ処理（要件準拠）
      console.log('eraSettings同期前:', { 
        local: eraSettings, 
        localLength: eraSettings ? eraSettings.length : 0,
        windowEraSettings: window.eraSettings,
        windowLength: window.eraSettings ? window.eraSettings.length : 0,
        remote: remoteEraSettings, 
        remoteLength: remoteEraSettings.length 
      });
      
      // 仕様:
      // ・ローカルにある時代区分名がリモートにあれば、リモートのその時代区分をローカルで上書き
      // ・ローカルにあるがリモートにない時代区分は何もしない（ローカル保持、リモートに保存しない）
      // ・ローカルにない時代区分でリモートにあるものはローカルへ取り込み
      const localBase = (window.eraSettings && window.eraSettings.length > 0) ? window.eraSettings : (eraSettings || []);
      const remoteBase = remoteEraSettings || [];
      const nameToRemote = new Map(remoteBase.map(e => [String(e.name||''), e]));
      const nameToLocal  = new Map(localBase.map(e => [String(e.name||''), e]));
      const mergedEraSettings = [];
      const toSaveEraSettings = []; // リモートに保存する時代区分（ローカルにないリモート分のみ）
      const seen = new Set();
      // ローカル基準に反映（上書き or そのまま）
      for (const loc of localBase){
        const key = String(loc.name||'');
        if (!key){ continue; }
        if (nameToRemote.has(key)){
          // 同名があれば、リモートの項目をローカルの値で上書き（ローカル優先）
          const remoteEra = nameToRemote.get(key);
          const mergedEra = { ...remoteEra, ...loc };
          mergedEraSettings.push(mergedEra);
          toSaveEraSettings.push(mergedEra); // リモートに保存
        } else {
          // リモートに無い時代区分はそのまま保持
          mergedEraSettings.push(loc);
          // リモートに保存しない（ローカルのみ保持）
        }
        seen.add(key);
      }
      // ローカルにないがリモートにある分を追加
      for (const rem of remoteBase){
        const key = String(rem.name||'');
        if (!key || seen.has(key)) continue;
        mergedEraSettings.push(rem);
        toSaveEraSettings.push(rem); // リモートに保存
      }
      console.log('eraSettings同期後:', { 
        merged: mergedEraSettings, 
        mergedLength: mergedEraSettings.length 
      });

      // 4. マージしたデータを保存（期待するSHAを指定）
      console.log('GitHubにデータを保存中...');
      const dataToSave = {
        events: merged,
        eraSettings: toSaveEraSettings, // リモートに保存するのは同名上書き分と新規取り込み分のみ
        genres: GENRES.map(code=>({code, label: (GENRE_LABELS && GENRE_LABELS[code]) ? GENRE_LABELS[code] : code}))
      };
      console.log('保存するデータ構造:', {
        hasEvents: !!dataToSave.events,
        eventsKeys: Object.keys(dataToSave.events || {}),
        hasEraSettings: !!dataToSave.eraSettings,
        eraSettingsLength: dataToSave.eraSettings.length,
        eraSettingsContent: dataToSave.eraSettings
      });
      const success = await saveToGitHub(dataToSave, remoteSha);
      if (success) {
        events = merged;
        
        // eraSettingsを確実にローカルに反映
        eraSettings = mergedEraSettings;
        window.eraSettings = mergedEraSettings;
        
        console.log('同期完了後のeraSettings:', eraSettings);
        console.log('同期完了後のwindow.eraSettings:', window.eraSettings);
        
        saveEvents();
        console.log('saveEvents後のeraSettings確認:', eraSettings);
        renderEvents();
        renderEraBackgrounds();
        
        // 同期完了時刻を記録
        localStorage.setItem('lastSync', new Date().toISOString());
        lastSavedEventsData = JSON.stringify(events); // 自動保存の基準を更新
        updateSyncStatus();
        
        // データ鮮度時刻を更新
        setDataFreshnessTimestamp(timestamp);
        
        // 編集フラグ・削除記録・バックアップをクリア
        clearEditFlags();
        clearDeletionRecords();
        clearLabelBackups();
        
        // 競合があった場合は競合通知を表示、なければ通常の完了メッセージを表示
        if (conflicts.length > 0) {
          showConflictNotification(conflicts);
        } else {
          showInfo('同期完了', 'GitHubとの同期が完了しました。');
        }
        console.log('同期処理完了');
      } else {
        console.log('GitHubへの保存に失敗');
      }
    } catch (error) {
      console.error('同期エラーの詳細:', error);
      
      // 競合エラーの場合は詳細な競合情報を表示
      if (error instanceof ConflictError) {
        showConflictNotification(error.conflicts);
        return;
      }
      
      showError('同期エラー', `同期処理でエラーが発生しました: ${error.message}`);
    }
  }
  
  // GitHubからデータとSHAハッシュを同時に取得
  async function loadFromGitHubWithSha() {
    if (!githubConfig.accessToken) {
      // トークンがない場合はCSVエクスポートのオプションを提供
      const hasData = Object.keys(events).length > 0;
      if (hasData) {
        const result = confirm('GitHubアクセストークンが設定されていません。\n\n変更された項目のみをCSVファイルとしてエクスポートして、管理者に送信しますか？\n\n「OK」: CSVファイルをダウンロード\n「キャンセル」: 何もしない');
        if (result) {
          exportToCSV();
        }
      } else {
        showError('設定エラー', 'GitHubアクセストークンが設定されていません。GitHubでログインしてください。');
      }
      return { remoteData: null, remoteSha: null, remoteEraSettings: [], timestamp: null };
    }

    try {
      const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}`, {
        headers: {
          'Authorization': `Bearer ${githubConfig.accessToken}`,
          'Accept': 'application/vnd.github.v3+json'
        },
        cache: 'no-store'
      });

      if (!response.ok) {
        if (response.status === 404) {
          // ファイルが存在しない場合は空のデータを返す
          return { remoteData: {}, remoteSha: null, remoteEraSettings: [] };
        }
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      const responseData = await response.json();
      const sha = responseData.sha;
      
      // GitHub APIのBase64データを正しくデコード
      const binaryString = atob(responseData.content);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const content = new TextDecoder('utf-8').decode(bytes);
      const data = JSON.parse(content);
      
      // タイムスタンプを取得
      const timestamp = responseData.last_modified || new Date().toISOString();
      
      if (data.events) {
        // 新しい形式（events + eraSettings）
        return { 
          remoteData: data.events, 
          remoteSha: sha, 
          remoteEraSettings: data.eraSettings || [],
          timestamp: timestamp
        };
      } else {
        // 古い形式（eventsのみ）
        return { 
          remoteData: data, 
          remoteSha: sha, 
          remoteEraSettings: [],
          timestamp: timestamp
        };
      }
    } catch (error) {
      showError('読み込みエラー', `GitHubからの読み込みに失敗しました: ${error.message}`);
      return { remoteData: null, remoteSha: null, remoteEraSettings: [], timestamp: null };
    }
  }

  // ===== CSV/TSV ロード =====
  function detectDelim(sample){ const cntTab=(sample.match(/\t/g)||[]).length; const cntSemi=(sample.match(/;/g)||[]).length; const cntComma=(sample.match(/,/g)||[]).length; const arr=[["\t",cntTab],[";",cntSemi],[",",cntComma]].sort((a,b)=>b[1]-a[1]); return arr[0][1]>0 ? arr[0][0] : ';'; }
  fileInput.addEventListener('change', async (e)=>{ const f=e.target.files && e.target.files[0]; if(!f) return; const text = await f.text(); const {addedCount, errors} = importSeparatedText(text); if(errors.length){ const summary = `正常に追加: ${addedCount} 件`; showError('CSV/TSV読込エラー', [summary, ...errors]); } else if(addedCount>0){ saveEvents(); renderEvents(); showInfo('読み込み完了', `${addedCount} 件を追加しました。`); } else { showInfo('結果', '追加された項目はありませんでした。'); } if(addedCount>0){ saveEvents(); renderEvents(); } fileInput.value=''; });

  function importSeparatedText(text){
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    let firstNonEmpty = lines.find(l=>l.trim().length>0) || '';
    const delim = detectDelim(firstNonEmpty);
    let addedCount=0; const errors=[];
    const seen=buildLabelGenreSet();
    for(let i=0;i<lines.length;i++){
      const raw=lines[i].trim(); 
      // 改行のみの行と「#」で始まる行を無視
      if(!raw || raw.startsWith('#')) continue;
      const cols=raw.split(delim);
      if(i===0 && /年/.test(cols[0])) continue;
      if(cols.length<3){ errors.push(`${i+1}行目: 列数不足（開始年${delim}終了年${delim}ラベル${delim}ジャンル${delim}重要度${delim}URL${delim}注釈）`); continue; }
      const startYearStr=(cols[0]||'').trim();
      const endYearStr=(cols[1]||'').trim();
      const label=(cols[2]||'').trim();
      const genreStr=(cols[3]||'').trim();
      const impStr=(cols[4]||'').trim();
      const url=(cols[5]||'').trim();
      const note=(cols[6]||'').trim();
      
      // 開始年の検証
      if(startYearStr && !(startYearStr.match(/^\d{4}$/) && parseInt(startYearStr,10)>=YEAR_MIN && parseInt(startYearStr,10)<=YEAR_MAX)){
        errors.push(`${i+1}行目: 開始年が不正または範囲外（${startYearStr}）`); continue;
      }
      
      // 終了年の検証（「ongoing」も許可）
      if(endYearStr && endYearStr.toLowerCase() !== 'ongoing' && !(endYearStr.match(/^\d{4}$/) && parseInt(endYearStr,10)>=YEAR_MIN && parseInt(endYearStr,10)<=YEAR_MAX)){
        errors.push(`${i+1}行目: 終了年が不正または範囲外（${endYearStr}）`); continue;
      }
      
      // 開始年と終了年の関係性検証（「ongoing」の場合はスキップ）
      if(startYearStr && endYearStr && endYearStr.toLowerCase() !== 'ongoing' && parseInt(startYearStr,10) > parseInt(endYearStr,10)){
        errors.push(`${i+1}行目: 開始年が終了年より後になっています（${startYearStr} > ${endYearStr}）`); continue;
      }
      
      if(!label){ errors.push(`${i+1}行目: ラベルが空です`); continue; }
      const genres = genreStr ? genreStr.split('・').map(g => g.trim().toUpperCase()) : [];
      const genreKey = genres.length > 0 ? genres.map(g=>String(g).toUpperCase()).sort().join('・') : '';
      const key = `${label}|${genreKey}`;
      // 動的ジャンル: 不正チェックは行わず、そのまま受け入れ
      if(impStr){ const n=parseInt(impStr,10); if(!(n>=1 && n<=5)){ errors.push(`${i+1}行目: 不正な重要度（${impStr}）`); continue; } }
      
      // アイテムの年を決定（開始年があれば開始年、なければ終了年、どちらもなければエラー）
      let itemYear;
      if(startYearStr) {
        itemYear = parseInt(startYearStr,10);
      } else if(endYearStr && endYearStr.toLowerCase() !== 'ongoing') {
        itemYear = parseInt(endYearStr,10);
      } else if(endYearStr && endYearStr.toLowerCase() === 'ongoing') {
        // ongoingの場合は開始年が必要
        if(!startYearStr) {
          errors.push(`${i+1}行目: 終了年が「ongoing」の場合は開始年が必要です`); continue;
        }
        itemYear = parseInt(startYearStr,10);
      } else {
        errors.push(`${i+1}行目: 開始年または終了年のいずれかが必要です`); continue;
      }
      
      const item={ label }; 
      if(startYearStr) item.startYear=parseInt(startYearStr,10); 
      if(endYearStr) {
        if(endYearStr.toLowerCase() === 'ongoing') {
          item.endYear = 'ongoing';
        } else {
          item.endYear = parseInt(endYearStr,10);
        }
      } 
      if(genres.length > 0) item.genre=genres; 
      if(impStr) item.imp=parseInt(impStr,10); 
      if(url) item.url=url; 
      if(note) item.note=note;
      
      const deletedCol = (cols[7]||'').trim().toLowerCase();
      const isDeleted = deletedCol === 'true';

      if(!events[itemYear]) events[itemYear]=[]; 

      // 既存の同一キー（開始年・ラベル・ジャンル一致）を検索
      const sameKey = (it)=>{
        const gA = Array.isArray(it.genre) ? it.genre.slice().map(g=>String(g).toUpperCase()).sort().join('・') : (it.genre||'');
        return (it.label||'')===label && gA===genreKey && Number(it.startYear||itemYear)===Number(itemYear);
      };
      const arr = events[itemYear];
      const idx = arr.findIndex(sameKey);
      if(isDeleted){
        // (2) deleted=true の場合は該当項目を削除
        if(idx!==-1){ arr.splice(idx,1); }
        // リモートからも除去されるよう tombstone を記録
        try{ addDeletionRecord(itemYear, { startYear: itemYear, label, genre: (genres.length>0? genres : genreKey) }); }catch(_e){}
      } else {
        // (1) 同一キーがあれば上書き、なければ追加
        if(idx!==-1){ arr[idx] = item; } else { arr.push(item); }
        // seen は重複検出用。ここでは上書き対象も既存扱いにする
        seen.add(key);
        addedCount++;
      }
    }
    return {addedCount, errors};
  }

          birthYearOverlayEl.style.display = 'block';
        }
      }
      function onDragMove(clientY){
        if(!dragging) return;
        // マウス（またはタッチ）位置をコンテンツ座標に変換し、その位置の年で〇を更新。スクロールしても〇がポインタからずれない
        if(vp){
          const vpRect = vp.getBoundingClientRect();
          const contentY = vp.scrollTop + (clientY - vpRect.top);
          state[prop] = yearFromY(contentY);
        } else {
          const dy=clientY-startY;
          const dYear=Math.round(dy/PX_PER_YEAR);
          state[prop]=Math.max(YEAR_MIN,Math.min(YEAR_MAX,startVal+dYear));
        }
        redraw();
        if(color==='blue' && el===eh && window.updateProbeEventsPanel){ window.updateProbeEventsPanel(state.eventYear); }
        if(color==='blue' && el===bh && birthYearOverlayEl && birthYearOverlayEl.style.display !== 'none'){
          birthYearOverlayEl.textContent = isEnglishUi() ? (state.birthYear + '') : (state.birthYear + '年');
        }
        // ドラッグ中は〇が表示域から出そうになったらスクロールして追従（0.1秒で約1年分のスピード）
        if(vp){
          const y = yFromBirthYear(state[prop]);
          const vpH = vp.clientHeight || 0;
          const maxScroll = Math.max(0, vp.scrollHeight - vpH);
          const MARGIN = 80;
          let targetTop = vp.scrollTop;
          if(y < vp.scrollTop + MARGIN){
            targetTop = Math.max(0, y - MARGIN);
          } else if(y > vp.scrollTop + vpH - MARGIN){
            targetTop = Math.min(maxScroll, y - vpH + MARGIN);
          }
          if(targetTop !== vp.scrollTop){
            const d = targetTop - vp.scrollTop;
            const now = Date.now();
            const elapsed = lastScrollTime ? Math.min(now - lastScrollTime, 150) : 100;
            const maxStep = (elapsed / 100) * PX_PER_YEAR; // 100msで1年分
            lastScrollTime = now;
            vp.scrollTop += (d > 0 ? Math.min(maxStep, d) : Math.max(-maxStep, d));
          }
        }
      }
      function onDragEnd(){
        if (!dragging) return;
        if(el===bh && birthYearOverlayEl){ birthYearOverlayEl.style.display = 'none'; }
        const doBirthYearRelease = (el===bh && pendingBirthYearRelease && window.kioskMode && window.kioskState && !window.kioskState.eventYearMoved);
        dragging = false;
        pendingBirthYearRelease = false;
        endDrag();
        // 上の〇を離したら下の〇を生年+6年にセット
        if(el===bh){
          state.eventYear = Math.max(YEAR_MIN, Math.min(YEAR_MAX, state.birthYear + 6));
          redraw();
          if(color==='blue' && window.updateProbeEventsPanel){ window.updateProbeEventsPanel(state.eventYear); }
        }
        if (doBirthYearRelease) {
          window.kioskState.eventYearMoved = true;
          window.kioskState.step = 3;
          window.kioskState.showLowerOverlay = true;
          window.kioskState.step3ChecklistActivated = false;
          updateKioskHint();
          updateKioskStepOverlay();
        }
      }
      el.addEventListener('mousedown',e=>{ onDragStart(e.clientY); e.preventDefault(); e.stopPropagation(); });
      window.addEventListener('mousemove',e=>{ onDragMove(e.clientY); });
      window.addEventListener('mouseup',onDragEnd);
      el.addEventListener('touchstart',e=>{
        if(e.touches.length!==1) return;
        onDragStart(e.touches[0].clientY);
        e.preventDefault();
      },{passive:false});
      window.addEventListener('touchmove',e=>{
        if(!dragging || e.touches.length!==1) return;
        onDragMove(e.touches[0].clientY);
        e.preventDefault();
      },{passive:false});
      window.addEventListener('touchend',e=>{
        if(e.touches.length===0) onDragEnd();
      });
      window.addEventListener('touchcancel',e=>{
        if(e.touches.length===0) onDragEnd();
      });
    }
    dragByYear(eh,'eventYear'); dragByYear(bh,'birthYear'); dragByYear(vLine,'birthYear');

    state.redraw=redraw; redraw(); return state;
  }

  // ジャンルごとの登録件数を計算する関数
  function getGenreCounts() {
    const counts = {};
    const genreLabels = GENRE_LABELS;
    
    // 各ジャンルの件数を初期化
    for (const code of GENRES) counts[code] = 0;
    
    // 実際のデータから件数を計算（配列ジャンル対応）
    for (const items of Object.values(events)) {
      for (const item of (items || [])) {
        const g = item.genre;
        if (Array.isArray(g)) {
          for (const codeRaw of g) {
            const code = String(codeRaw || 'UNC').toUpperCase();
            if (!(code in counts)) counts[code] = 0; // 未知ジャンルも計上
            counts[code]++;
          }
        } else {
          const code = String(g || 'UNC').toUpperCase();
          if (!(code in counts)) counts[code] = 0;
          counts[code]++;
        }
      }
    }
    
    return counts;
  }

        '関心のあるジャンルをいくつか選んでください。「適用」を押すと次へ進みます。表示したいジャンルは画面上の「ジャンル選択」メニューからいつでも変更できます。',
        'Select the genres that interest you. Press "Apply" to continue. You can change visible genres anytime from the "Genres" menu.'
      );
      nextBtn.style.display = 'none';
    } else if (kioskState.step === 2) {
      titleEl.textContent = t('ステップ2：生まれた年をセット', 'Step 2: Set your birth year');
      bodyEl.textContent = t(
        '青い斜め線の左上の〇を上下にドラッグして自分の生まれ年に合わせてください。',
        'Drag the circle at the upper-left end of the blue diagonal line up/down to your birth year.'
      );
      nextBtn.style.display = 'none';
      finishBtn.style.display = 'none';
      // ステップ2: 「チェックされた数」の右に「最初に戻る」を配置（同じ行）
      if (restartBtn) {
        restartBtn.style.display = 'inline-block';
        countEl.style.display = 'flex';
        countEl.style.alignItems = 'center';
        countEl.style.justifyContent = 'space-between';
        countEl.style.gap = '10px';
        countEl.style.flexWrap = 'wrap';
        // countEl にボタンを移動して右側に置く
        countEl.appendChild(restartBtn);
        restartBtn.style.marginTop = '0';
      }
    } else if (kioskState.step === 3) {
      const isMobile = isMobileLikeViewport();
      const step3Compact = isMobile && kioskState.step3StartedOperating;
      if (step3Compact) {
        document.body.classList.add('kiosk-step3-compact-hint');
        titleEl.style.display = 'none';
        bodyEl.style.display = 'none';
        box.classList.add('kiosk-hint-step3-compact');
        countEl.textContent = count + '/' + minCount;
        countEl.style.display = 'block';
        nextBtn.style.display = 'none';
        if (step3Actions) step3Actions.style.display = 'flex';
        finishBtn.style.display = 'inline-block';
        finishBtn.textContent = t('診断', 'Diagnose');
        finishBtn.disabled = count < minCount;
        if (restartBtn && step3Actions) {
          restartBtn.style.display = 'inline-block';
          // step3Actions に戻して「診断」の右に置く
          step3Actions.insertBefore(restartBtn, yearControls);
          restartBtn.style.marginTop = '';
        }
        if (yearControls) yearControls.style.display = 'flex';
        if (typeof window.scrollProbeEventYearIntoView === 'function') {
          setTimeout(function() { window.scrollProbeEventYearIntoView(); }, 100);
        }
      } else {
        titleEl.style.display = '';
        bodyEl.style.display = '';
        box.classList.remove('kiosk-hint-step3-compact');
        titleEl.textContent = t('ステップ3：チェックボックスで選択', 'Step 3: Select events with checkboxes');
        const desc = getLocalizedCfrPrompt('eventChecklistDescription');
        bodyEl.textContent = desc + (isEnglishUi() ? ' You can press "Diagnose" after checking ' + minCount + ' or more items.' : ' ' + minCount + '個以上チェックすると「診断」ボタンが押せるようになります。');
        countEl.textContent = isEnglishUi() ? ('Checked: ' + count + ' / ' + minCount) : ('チェックされた数: ' + count + ' / ' + minCount);
        nextBtn.style.display = 'none';
        if (step3Actions) step3Actions.style.display = 'flex';
        finishBtn.style.display = 'inline-block';
        finishBtn.textContent = t('診断', 'Diagnose');
        finishBtn.disabled = count < minCount;
        if (restartBtn && step3Actions) {
          restartBtn.style.display = 'inline-block';
          // 「診断」の右に配置（年ボタン群の前）
          step3Actions.insertBefore(restartBtn, yearControls);
          restartBtn.style.marginTop = '';
        }
        if (!isMobile) {
          box.classList.add('kiosk-hint-step3-pc');
        }
        if (yearControls) yearControls.style.display = 'flex';
        // スマホ: 画面のどこかを触ったらステップ3の説明を消してコンパクト表示へ
        if (isMobile && !box.dataset.step3TouchListener) {
          box.dataset.step3TouchListener = '1';
          const goCompact = function() {
            kioskState.step3StartedOperating = true;
            updateKioskHint();
          };
          document.addEventListener('touchstart', goCompact, { once: true, passive: true });
          document.addEventListener('click', goCompact, { once: true });
        }
      }
    } else if (kioskState.step === 4) {
      titleEl.textContent = t('ありがとうございました', 'Thank you');
      bodyEl.textContent = t('お疲れさまでした。m(_ _)m ', 'Session complete.');
      nextBtn.style.display = 'none';
      finishBtn.style.display = 'none';
      if (restartBtn) restartBtn.style.display = 'none';
    } else {
      box.style.display = 'none';
    }
    updateKioskStepOverlay();
  }

  function kioskOnGenresApplied() {
    if (!window.kioskMode) return;
    if (kioskState.step < 1) return;
    // すでにチェック中（step3）以降なら進行を戻さない
    if (kioskState.step < 3) {
      kioskState.step = 2;
      kioskState.eventYearMoved = false;
      kioskState.showLowerOverlay = false;
      kioskState.step3StartedOperating = false;
      kioskState.step3ChecklistActivated = false;
    }
    updateKioskHint();
    if (isMobileLikeViewport() && typeof probeBlue !== 'undefined' && vp) {
      setTimeout(() => {
        try {
          const yBirth = yFromBirthYear(probeBlue.birthYear);
          const msgTop = 72, msgH = 40, gap = 10;
          const targetY = msgTop + msgH + gap;
          const maxScroll = Math.max(0, vp.scrollHeight - (vp.clientHeight || 0));
          vp.scrollTop = Math.max(0, Math.min(maxScroll, yBirth - targetY));
        } catch (_) {}
      }, 80);
    }
  }
  window.kioskOnGenresApplied = kioskOnGenresApplied;

  const KIOSK_NICKNAME_MAX = 16;
  const KIOSK_NICKNAME_DEFAULT = 'Guest';
  function normalizeKioskNickname(raw) {
    const chars = Array.from(String(raw || '').trim());
    const clipped = chars.slice(0, KIOSK_NICKNAME_MAX).join('');
    return clipped || KIOSK_NICKNAME_DEFAULT;
  }
  function escapeHtmlText(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function toKatakana(s) {
    return String(s).replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
  }
  function setupKioskNicknamePad(overlay) {
    const input = overlay.querySelector('#kioskNicknameInput');
    const modeWrap = overlay.querySelector('#kioskPadModes');
    const subWrap = overlay.querySelector('#kioskPadSubModes');
    const grid = overlay.querySelector('#kioskPadGrid');
    if (!input || !modeWrap || !subWrap || !grid) return;
    // モード切替行をキーボードの下へ移動（左:モード / 右:編集キー）
    if (grid.parentNode) {
      grid.parentNode.insertBefore(modeWrap, grid.nextSibling);
      grid.parentNode.insertBefore(subWrap, modeWrap.nextSibling);
    }

    const KANA_MOD_KEY = '__KANA_MOD_KEY__';
    const kanaRows = [
      ['わ','ら','や','ま','は','な','た','さ','か','あ'],
      ['を','り','','み','ひ','に','ち','し','き','い'],
      ['ん','る','ゆ','む','ふ','ぬ','つ','す','く','う'],
      ['ー','れ','','め','へ','ね','て','せ','け','え'],
      [KANA_MOD_KEY,'ろ','よ','も','ほ','の','と','そ','こ','お']
    ];
    const upperRows = [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L',''],
      ['@','Z','X','C','V','B','N','M','-','_']
    ];
    const lowerRows = [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l',''],
      ['@','z','x','c','v','b','n','m','-','_']
    ];

    const st = {
      mode: 'lower' // kana | kata | upper | lower
    };

    function pushChar(ch) {
      const chars = Array.from(input.value || '');
      if (chars.length >= KIOSK_NICKNAME_MAX) return;
      chars.push(ch);
      input.value = chars.join('');
    }
    function backspaceOne() {
      const chars = Array.from(input.value || '');
      chars.pop();
      input.value = chars.join('');
    }
    function clearAll() {
      input.value = '';
    }
    const kanaTransformCycles = [
      ['か','が'],['き','ぎ'],['く','ぐ'],['け','げ'],['こ','ご'],
      ['さ','ざ'],['し','じ'],['す','ず'],['せ','ぜ'],['そ','ぞ'],
      ['た','だ'],['ち','ぢ'],['つ','づ'],['て','で'],['と','ど'],
      ['は','ば','ぱ'],['ひ','び','ぴ'],['ふ','ぶ','ぷ'],['へ','べ','ぺ'],['ほ','ぼ','ぽ'],
      ['う','ゔ'],
      ['あ','ぁ'],['い','ぃ'],['う','ぅ'],['え','ぇ'],['お','ぉ'],
      ['や','ゃ'],['ゆ','ゅ'],['よ','ょ'],['つ','っ'],['わ','ゎ'],
      ['カ','ガ'],['キ','ギ'],['ク','グ'],['ケ','ゲ'],['コ','ゴ'],
      ['サ','ザ'],['シ','ジ'],['ス','ズ'],['セ','ゼ'],['ソ','ゾ'],
      ['タ','ダ'],['チ','ヂ'],['ツ','ヅ'],['テ','デ'],['ト','ド'],
      ['ハ','バ','パ'],['ヒ','ビ','ピ'],['フ','ブ','プ'],['ヘ','ベ','ペ'],['ホ','ボ','ポ'],
      ['ウ','ヴ'],
      ['ア','ァ'],['イ','ィ'],['ウ','ゥ'],['エ','ェ'],['オ','ォ'],
      ['ヤ','ャ'],['ユ','ュ'],['ヨ','ョ'],['ツ','ッ'],['ワ','ヮ']
    ];
    function cycleLastKanaChar() {
      const chars = Array.from(input.value || '');
      if (!chars.length) return;
      const last = chars[chars.length - 1];
      for (const cycle of kanaTransformCycles) {
        const idx = cycle.indexOf(last);
        if (idx !== -1) {
          chars[chars.length - 1] = cycle[(idx + 1) % cycle.length];
          input.value = chars.join('');
          return;
        }
      }
    }

    function mkBtn(label, onClick, cssText) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      btn.style.cssText = cssText || 'padding:6px 10px; border-radius:8px; border:1px solid #ccc; background:#fff; color:#222; cursor:pointer; font-size:14px; font-weight:500;';
      btn.addEventListener('click', onClick);
      return btn;
    }

    function render() {
      modeWrap.innerHTML = '';
      subWrap.innerHTML = '';
      grid.innerHTML = '';

      const modeBtnCss = 'padding:6px 10px; border-radius:8px; border:1px solid #ccc; cursor:pointer; font-size:14px; font-weight:600;';
      const activeCss = 'background:#6366f1; color:#fff; border-color:#6366f1;';
      const normalCss = 'background:#f8fafc; color:#1e293b;';

      // ラッパー: スマホは2段（かな〜abc / 空白〜←）、PCは1行（左: かな〜abc、右: 空白〜←）
      const bottomWrap = document.createElement('div');
      bottomWrap.className = 'kiosk-pad-modes-inner';
      bottomWrap.style.cssText = 'display:flex; flex-direction:column; gap:8px; width:100%;';
      // 1行目: かな・カナ・ABC・abc
      const modeRow = document.createElement('div');
      modeRow.className = 'kiosk-pad-mode-row';
      modeRow.style.cssText = 'display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-start; width:100%; margin-bottom:8px;';
      const kanaBtn = mkBtn('かな', () => { st.mode = 'kana'; render(); }, modeBtnCss + (st.mode === 'kana' ? activeCss : normalCss));
      const kataBtn = mkBtn('カナ', () => { st.mode = 'kata'; render(); }, modeBtnCss + (st.mode === 'kata' ? activeCss : normalCss));
      const abcBtn  = mkBtn('ABC', () => { st.mode = 'upper'; render(); }, modeBtnCss + (st.mode === 'upper' ? activeCss : normalCss));
      const abcLowerBtn = mkBtn('abc', () => { st.mode = 'lower'; render(); }, modeBtnCss + (st.mode === 'lower' ? activeCss : normalCss));
      modeRow.appendChild(kanaBtn);
      modeRow.appendChild(kataBtn);
      modeRow.appendChild(abcBtn);
      modeRow.appendChild(abcLowerBtn);

      // 2行目: 空白・Clear・←（スマホでは下段、PCでは右側に表示）
      const actionRow = document.createElement('div');
      actionRow.className = 'kiosk-pad-action-row';
      actionRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%;';
      subWrap.style.display = 'none';

      const keyCss = 'padding:0; height:50px; border-radius:8px; border:1px solid #9f9f9f; background:#e6e6e6; color:#222; cursor:pointer; font-size:20px; line-height:1.2; font-weight:500;';
      const makeCharBtn = (ch) => mkBtn(ch, () => pushChar(ch), keyCss);
      const makeKanaModBtn = () => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.cssText = 'padding:0; height:50px; border-radius:8px; border:1px solid #f4b46b; background:#fff3e0; color:#e65100; cursor:pointer; font-size:16px; line-height:1.1; font-weight:700;';
        btn.textContent = '゛゜/小';
        btn.addEventListener('click', cycleLastKanaChar);
        return btn;
      };
      const addRow = (arr, transformFn, halfShift) => {
        arr.forEach(ch => {
          if (!ch) {
            const spacer = document.createElement('div');
            spacer.setAttribute('aria-hidden', 'true');
            grid.appendChild(spacer);
            return;
          }
          if (ch === KANA_MOD_KEY) {
            grid.appendChild(makeKanaModBtn());
            return;
          }
          const btn = makeCharBtn(transformFn ? transformFn(ch) : ch);
          if (halfShift) {
            // ASDF 行を半キー分だけ右にずらす
            btn.style.transform = 'translateX(calc(50% + 3px))';
          }
          grid.appendChild(btn);
        });
      };

      if (st.mode === 'kana') {
        kanaRows.forEach(r => addRow(r));
      } else if (st.mode === 'kata') {
        kanaRows.forEach(r => addRow(r, toKatakana));
      } else if (st.mode === 'upper') {
        upperRows.forEach((r, idx) => addRow(r, null, idx === 2));
      } else {
        lowerRows.forEach((r, idx) => addRow(r, null, idx === 2));
      }

      const actionBaseCss = 'padding:8px 14px; border-radius:10px; cursor:pointer; line-height:1.2; font-weight:600;';
      const spaceBtn = mkBtn(t('空白', 'Space'), () => pushChar(' '), actionBaseCss + 'border:1px solid #8a8a8a; background:#e0e0e0; color:#111; font-size:16px; font-weight:500; min-width:88px;');
      const clearBtn = mkBtn('Clear', clearAll, actionBaseCss + 'border:1px solid #c45b5b; background:#fff; color:#7a1b1b; font-size:20px; font-weight:500; min-width:88px;');
      const backBtn = mkBtn('←', backspaceOne, actionBaseCss + 'border:1px solid #c45b5b; background:#fff; color:#7a1b1b; font-size:24px; font-weight:800; min-width:76px;');
      actionRow.appendChild(spaceBtn);
      actionRow.appendChild(clearBtn);
      actionRow.appendChild(backBtn);
      bottomWrap.appendChild(modeRow);
      bottomWrap.appendChild(actionRow);
      modeWrap.appendChild(bottomWrap);
    }

    input.readOnly = true;
    input.inputMode = 'none';
    input.maxLength = KIOSK_NICKNAME_MAX;
    input.placeholder = KIOSK_NICKNAME_DEFAULT;
    render();
  }

  function openKioskStartOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'kioskStartOverlay';
    const wizard = {
      step: 1,

      wizard.step = 2;
      renderStep();

    const showMobileViewportAdvice = (onClose) => {

            </div>

        overlay.innerHTML = `
          <div class="inner">
            <div style="margin:12px 0; padding:10px 12px; border-radius:8px; background:#f8fafc; border:1px solid #e0e7ff; font-size:13px;">
              <div style="margin-bottom:6px; font-size:18px;">${t('あなたの性別とニックネームを教えてください', 'Tell us your gender and nickname')}</div>

                  <span>${t('性別:', 'Gender:')}</span>
                  <label style="margin-left:4px;"><input type="radio" name="kioskGender" value="男"> ${t('男', 'Male')}</label>
                  <label style="margin-left:4px;"><input type="radio" name="kioskGender" value="女"> ${t('女', 'Female')}</label>
                  <label style="margin-left:4px;"><input type="radio" name="kioskGender" value="答えない"> ${t('答えない', 'Prefer not to say')}</label>
                </div>
              </div>
              <div style="margin-top:8px;">
                <div style="margin-bottom:6px; font-size:18px;">${t('ニックネーム（最大16文字をソフトウェアキーボードで入力してください）:', 'Nickname (max 16 chars, use software keyboard):')}</div>
                <input type="text" id="kioskNicknameInput" placeholder="Guest" style="width:100%; max-width:520px; font-size:18px; padding:8px 10px; border-radius:8px; border:1px solid #ccc;" aria-label="${t('ニックネーム（クリック入力）', 'Nickname (tap/click to input)')}">
                <div style="margin-bottom:6px; font-size:14px;">${t('※ニックネームはみんなのチェックリスト画面などで表示されます:', 'The nickname may appear on checklist/result screens.')}</div>
                <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;" id="kioskPadModes"></div>
                <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;" id="kioskPadSubModes"></div>
                <div id="kioskPadGrid" style="margin-top:8px; display:grid; grid-template-columns:repeat(10, minmax(0, 1fr)); gap:6px;"></div>
              </div>
            </div>

              <button type="button" id="kioskStep2NextBtn">${t('次へ', 'Next')}</button>

  function openKioskChecklist(year) {
    if (!window.kioskMode || kioskState.step !== 3) return;
    const list = (events[year] || []).filter(passesFilter);
    if (!list.length) {
      openModalText(
        t('イベントがありません', 'No events'),
        isEnglishUi()
          ? `No selectable events are registered for ${year}. Please try another year.`
          : `${year}年には現在、選択できるイベントが登録されていません。別の年をお試しください。`
      );
      return;
    }
    const itemsHtml = list.map((it, idx) => {
      const key = `${year}__${it.label}`;
      const already = kioskState.selections.some(s => s.year === year && s.label === it.label);
      const checkedAttr = already ? 'checked' : '';
      return `
        <label style="display:block; margin:4px 0; cursor:pointer; font-size:20px;">
          <input type="checkbox" name="kioskItem" value="${key}" data-idx="${idx}" ${checkedAttr} style="margin-right:6px;">
          <strong>${escapeHtmlText(getPrimaryLabel(it))}</strong>${renderGenreBadge(it)}
        </label>
      `;
    }).join('');

    const html = `
      <p>${isEnglishUi() ? `Select from events in <strong>${year}</strong>.` : `<strong>${year}年</strong> のイベントの中から選んでください。`}</p>
      <div style="max-height:320px; overflow-y:auto; margin-top:8px;">
        ${itemsHtml}
      </div>
      <p style="margin-top:8px; font-size:17px; color:#666;">${t('※すでに選んだものにはチェックが入っています。', 'Already-selected items are checked.')}</p>
      <div style="text-align:right; margin-top:12px;">
        <button type="button" id="kioskChecklistOk" style="padding:6px 12px; border-radius:8px; border:none; background:#0d9488; color:#fff; cursor:pointer; font-weight:600;">${t('決定', 'OK')}</button>
      </div>

    openModal(t('イベント選択', 'Event Selection'), html);
    const okBtn = document.getElementById('kioskChecklistOk');
    okBtn.addEventListener('click', () => {

        openModalText(t('選択が必要です', 'Selection required'), t('少なくとも1つは選んでください。', 'Please select at least one item.'));

          kioskState.selections.push({

            label: it.label,
            genre: it.genre,

      kioskState.step3StartedOperating = true;
      closeModal();

    });

  function buildKioskReportAndAggregate() {
    const selections = kioskState.selections.slice();
    const total = selections.length;
    // decade 集計
    const decadeCount = {};
    selections.forEach(s => {
      const d = Math.floor(s.year / 10) * 10;
      decadeCount[d] = (decadeCount[d] || 0) + 1;
    });
    // ジャンル集計
    const genreCount = {};
    selections.forEach(s => {
      const g = s.genre;
      if (Array.isArray(g)) {
        g.forEach(code => {
          const c = String(code || 'UNC').toUpperCase();
          genreCount[c] = (genreCount[c] || 0) + 1;
        });
      } else if (g) {
        const c = String(g || 'UNC').toUpperCase();
        genreCount[c] = (genreCount[c] || 0) + 1;
      }
    });
    const sortedDecades = Object.keys(decadeCount).map(Number).sort((a,b)=>a-b);
    const sortedGenres = Object.keys(genreCount).sort((a,b)=>(genreCount[b]-genreCount[a]));

    let report = '';
    report += isEnglishUi()
      ? `You selected ${total} items in total. The strongest concentration appears in `
      : `あなたは全部で${total}個のコンテンツを選びました。その中で特に多かったのは、`;
    if (sortedDecades.length) {
      const topDecade = sortedDecades.reduce((a,b)=> decadeCount[a] >= decadeCount[b] ? a : b);
      report += isEnglishUi()
        ? `${topDecade}s (${decadeCount[topDecade]} items).`
        : `${topDecade}年代（${decadeCount[topDecade]}件）です。`;
    } else {
      report += isEnglishUi()
        ? 'no strong decade bias.'
        : '特定の年代に偏りは見られませんでした。';
    }
    report += '\n\n';
    if (sortedGenres.length) {
      const lines = sortedGenres.slice(0,3).map(code => {
        const label = getGenreLabel(code);
        return isEnglishUi() ? `${label} (${genreCount[code]})` : `${label}（${genreCount[code]}件）`;
      });
      report += isEnglishUi()
        ? `By genre, your interests are strongest in ${lines.join(', ')}.`
        : `ジャンル別では、${lines.join('、')} などへの関心が強く表れています。`;
    } else {
      report += isEnglishUi()
        ? 'No strong genre bias was observed.'
        : 'ジャンルの偏りはあまり見られませんでした。';
    }
    report += '\n\n';
    report += isEnglishUi()
      ? 'These patterns suggest you positively enjoy shifts across eras through works and services encountered during your formative years, with strong curiosity for technology and narrative worlds. (This is currently dummy text; later it will be replaced by a longer AI-generated report.)'
      : 'これらから推測すると、あなたは自分の成長期に触れた作品やサービスを通じて、時代の変化を前向きに楽しむタイプであり、テクノロジーや物語世界に対する想像力が豊かな人格が形成されていると考えられます。（この診断文はシステム上の理由でAIによる診断ができなかったために表示されるダミーです。）';

    // みんなの集計（ローカルストレージに蓄積）
    const key = 'xnative_kiosk_aggregate_v1';
    let agg;
    try {
      agg = JSON.parse(localStorage.getItem(key) || 'null') || { count:0, decade:{}, };
    } catch(e) {
      agg = { count:0, decade:{} };
    }
    agg.count += 1;
    Object.keys(decadeCount).forEach(d => {
      agg.decade[d] = (agg.decade[d] || 0) + decadeCount[d];
    });
    try {
      localStorage.setItem(key, JSON.stringify(agg));
    } catch(e) {}

    // グラフHTML（簡易棒グラフ）
    const maxGlobal = Math.max(1, ...Object.values(agg.decade));
    const decadeBars = Object.keys(agg.decade).sort((a,b)=>a-b).map(d => {
      const gVal = agg.decade[d];
      const uVal = decadeCount[d] || 0;
      const width = 140 * (gVal / maxGlobal);
      return `
        <div style="margin:4px 0; font-size:12px;">
          <div style="display:flex; justify-content:space-between;">
            <span>${isEnglishUi() ? `${d}s` : `${d}年代`}</span>
            <span>${isEnglishUi() ? `All:${gVal} / You:${uVal}` : `全体:${gVal} / あなた:${uVal}`}</span>
          </div>
          <div style="position:relative; height:10px; background:#e0e7ff; border-radius:5px; overflow:hidden;">
            <div style="position:absolute; left:0; top:0; bottom:0; width:${width}px; background:#a5b4fc;"></div>
            ${uVal ? `<div style="position:absolute; left:0; top:0; bottom:0; width:${140*(uVal/Math.max(gVal,1))}px; background:#6366f1; opacity:0.95;"></div>` : ''}
          </div>
        </div>
      `;
    }).join('');

    const aggregateHtml = `
      <p>${isEnglishUi() ? 'Responses on this device so far: ' : 'これまでにこの端末で回答した人数: '}<strong>${agg.count}${isEnglishUi() ? '' : '人'}</strong></p>
      <p>${isEnglishUi() ? 'Selection trend by decade (all vs you):' : '年代ごとの選択傾向（全体とあなたの比較）:'}</p>
      <div style="max-width:300px;">${decadeBars || (isEnglishUi() ? '<p>This is the first response.</p>' : '<p>今回が最初の回答です。</p>')}</div>
    `;

    return { report, aggregateHtml };
  }

  function buildGeminiPrompt(headOverride) {
    const birthYear = (typeof probeBlue !== 'undefined' && probeBlue.birthYear != null) ? probeBlue.birthYear : '';
    const gender = kioskState.gender || '';
    const nickname = normalizeKioskNickname(kioskState.nickname || '');
    const lines = kioskState.selections.map(s => {
      const source = (events[s.year] || []).find(it => it.label === s.label) || { label: s.label, label_en: '' };
      const label = getPrimaryLabel(source) || s.label;
      return isEnglishUi() ? `${s.year}: ${label}` : `${s.year}年: ${label}`;
    }).join('\n');
    const cfr = getCfrPrompts();
    const localizedDefaultHead = getLocalizedCfrPrompt('geminiPromptHead');
    const head = headOverride || (isEnglishUi() ? (cfr.geminiPromptHead_en || localizedDefaultHead) : (cfr.geminiPromptHead || localizedDefaultHead));
    return isEnglishUi()
      ? (head + `Nickname: ${nickname}\nGender: ${gender}\nBirth year: ${birthYear}\n\nSelected content (year: event):\n${lines}`)
      : (head + `ニックネーム: ${nickname}\n性別: ${gender}\n生年: ${birthYear}年\n\n選択したコンテンツ（年: イベント名）:\n${lines}`);
  }
  const GEMINI_MODEL = 'gemini-2.5-flash-lite';
  const MODE2_OPENAI_MODEL = 'gpt-5.4';
  function getTemperature() {
    const cfr = getCfrPrompts();
    const t = cfr.temperature ?? DEFAULT_CFR_PROMPTS.temperature ?? 0.9;
    const n = Number(t);
    return (Number.isNaN(n) || n < 0 || n > 2) ? 0.9 : n;
  }

  // Cloudflare / Netlify などのサーバ側で環境変数を使って呼び出す場合のバックエンド経由呼び出し
  async function callGeminiViaBackend(prompt) {
    const payload = { prompt, model: GEMINI_MODEL, temperature: getTemperature() };
    const endpoints = [
      '/api/gemini-diagnosis',                 // Cloudflare Pages Functions 等で /api/ 以下に配置した場合
      '/.netlify/functions/gemini-diagnosis'   // Netlify Functions
    ];

    let lastError = 'バックエンドエンドポイントに接続できませんでした。';
    for (const ep of endpoints) {
      try {
        const res = await fetch(ep, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          // 404 の場合は「このエンドポイントは存在しない」とみなして次を試す
          if (res.status === 404) {
            lastError = `HTTP 404 (${ep})`;
            continue;
          }
          const txt = await res.text().catch(() => '');
          return { ok: false, error: `HTTP ${res.status}: ${txt}` };
        }
        const data = await res.json().catch(() => null);
        if (data && typeof data.ok === 'boolean') {
          return data;
        }
        // 想定外フォーマット
        return { ok: false, error: 'バックエンドの応答形式が不正です。' };
      } catch (e) {
        lastError = (e && e.message) ? e.message : String(e);
      }
    }
    return { ok: false, error: lastError };
  }

  // OpenAI をサーバ側経由で呼び出す
  async function callOpenAiViaBackend(prompt, modelOverride) {
    try {
      const payload = { prompt, temperature: getTemperature() };
      if (modelOverride) payload.model = modelOverride;
      const res = await fetch('/api/openai-diagnosis', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data) {
        const msg = (data && data.error) ? data.error : `HTTP ${res.status}`;
        return { ok: false, error: String(msg) };
      }
      return data;
    } catch (e) {
      const msg = (e && e.message) ? e.message : String(e);
      return { ok: false, error: '通信エラー: ' + msg };
    }
  }

  // 実際に診断テキストを取得するメイン関数（headOverride を指定すると別プロンプトで呼び出し）
  async function fetchGeminiDiagnosis(headOverride) {
    const prompt = buildGeminiPrompt(headOverride);
    const cfr = getCfrPrompts();
    const provider = ((cfr.aiProvider || DEFAULT_CFR_PROMPTS.aiProvider || 'gemini') + '').toLowerCase();

    // 共通のリトライヘルパー（指定プロバイダを maxAttempts 回まで試行）
    const retryProvider = async (which, maxAttempts) => {
      let lastError = '';
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        const result = which === 'gemini'
          ? await callGeminiViaBackend(prompt)
          : await callOpenAiViaBackend(prompt);
        const hasText = !!(result && result.ok && typeof result.text === 'string' && result.text.trim());
        if (hasText) return result;

        const isEmptyOk = !!(result && result.ok && (!result.text || !String(result.text).trim()));
        if (isEmptyOk) {
          lastError = isEnglishUi()
            ? `Empty response from ${which} backend.`
            : `${which.toUpperCase()} バックエンドの応答が空でした。`;
        } else if (result && result.error) {
          lastError = result.error;
        } else if (result && !result.ok) {
          lastError = isEnglishUi()
            ? `Failed to call ${which} backend.`
            : `${which.toUpperCase()} バックエンドの呼び出しに失敗しました。`;
        } else {
          lastError = isEnglishUi()
            ? `Unexpected ${which} backend response format.`
            : `${which.toUpperCase()} バックエンドの応答形式が想定外です。`;
        }
      }
      return { ok: false, error: lastError || (isEnglishUi() ? 'Unknown error' : '不明なエラー') };
    };

    // aiprovider に応じて優先プロバイダとフォールバックプロバイダを切り替える
    const primary = (provider === 'openai') ? 'openai' : 'gemini';
    const secondary = (primary === 'gemini') ? 'openai' : 'gemini';

    // 優先プロバイダ: 最大3回
    const primaryResult = await retryProvider(primary, 3);
    if (primaryResult && primaryResult.ok && typeof primaryResult.text === 'string' && primaryResult.text.trim()) {
      return primaryResult;
    }

    // フォールバックプロバイダ: 最大4回
    const secondaryResult = await retryProvider(secondary, 4);
    if (secondaryResult && secondaryResult.ok && typeof secondaryResult.text === 'string' && secondaryResult.text.trim()) {
      return secondaryResult;
    }

    // どちらも失敗した場合は、両方のエラー情報をまとめて返す
    const combinedError = (() => {
      const pErr = primaryResult && primaryResult.error ? String(primaryResult.error) : '';
      const sErr = secondaryResult && secondaryResult.error ? String(secondaryResult.error) : '';
      if (pErr && sErr) {
        return isEnglishUi()
          ? `Primary ${primary} and fallback ${secondary} both failed. Primary: ${pErr} / Fallback: ${sErr}`
          : `優先${primary.toUpperCase()}とフォールバック${secondary.toUpperCase()}の両方が失敗しました。優先: ${pErr} / フォールバック: ${sErr}`;
      }
      return pErr || sErr || (isEnglishUi() ? 'Unknown error' : '不明なエラー');
    })();

    return { ok: false, error: combinedError };
  }

  const KIOSK_SESSIONS_KEY = 'xnative_kiosk_sessions_v1';
  function saveKioskSessionToStorage() {
    try {
      const birthYear = (typeof probeBlue !== 'undefined' && probeBlue.birthYear != null) ? probeBlue.birthYear : null;
      const raw = localStorage.getItem(KIOSK_SESSIONS_KEY) || '[]';
      const list = JSON.parse(raw);
      list.push({
        timestamp: new Date().toISOString(),
        gender: kioskState.gender || '',
        birthYear: birthYear,
        selections: kioskState.selections.map(s => {
          const arr = events[s.year] || [];
          const item = arr.find(it => it.label === s.label) || {};
          const genre = s.genre != null ? s.genre : item.genre;
          const url = item.url || '';
          const urlEn = item.url_e || item.url_en || item.URL_en || item.URL_e || item.urlEn || '';
          const labelEn = item.label_en || '';
          const note = item.note || '';
          const meaning = getKioskMeaningState(s);
          const meaningTags = MODE2_MEANING_DEFS.filter(def => !!meaning[def.key]).map(def => def.labelJa);
          return { year: s.year, label: s.label, label_en: labelEn, genre: genre, url: url, urlEn: urlEn, note: note, meaningTags: meaningTags };
        })
      });
      localStorage.setItem(KIOSK_SESSIONS_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  // 診断結果をサーバー側に送信（Railway/Fly.io は /api/、Netlify は .netlify/functions/）。1つ成功したら終了
  function submitDiagnosticResultToBackend(record) {
    const endpoints = [
      '/api/diagnostic-result',                 // Railway / Fly.io (Express)
      '/.netlify/functions/diagnostic-result'  // Netlify Functions
    ];
    const body = JSON.stringify(record);
    (async function tryEndpoints() {
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body
          });
          if (res.ok) {
            console.log('診断結果をサーバーに送信しました:', ep);
            return;
          }
          if (res.status === 404) continue;
        } catch (_) {}
      }
    })();
  }

  function buildDiagnosticBackendRecord(includeMeaningTags) {
    const birthYear = (typeof probeBlue !== 'undefined' && probeBlue.birthYear != null) ? probeBlue.birthYear : null;
    return {
      timestamp: new Date().toISOString(),
      nickname: normalizeKioskNickname(kioskState.nickname || ''),
      gender: kioskState.gender || '',
      birthYear: birthYear,
      owner: githubConfig.owner || '',
      repo: githubConfig.repo || '',
      testid: githubConfig.testId || '',
      testId: githubConfig.testId || '',
      filePath: githubConfig.filePath || '',
      selections: kioskState.selections.map(s => {
        const arr = events[s.year] || [];
        const item = arr.find(it => it.label === s.label) || {};
        const result = {
          year: s.year,
          label: s.label,
          label_en: item.label_en || '',
          genre: s.genre != null ? s.genre : ''
        };
        if (includeMeaningTags) {
          const meaning = getKioskMeaningState(s);
          result.meaningTags = MODE2_MEANING_DEFS.filter(def => !!meaning[def.key]).map(def => def.labelJa);
        }
        return result;
      }),
      selectedGenres: Array.from(selectedGenres || [])
    };
  }

    `;
    kioskModalPhase = 'diag';
    openModal(t('診断結果', 'Diagnosis Result'), html, { footer: 'next' });
    const pBtn = document.getElementById('kioskQrPersonalBtn');
    const gBtn = document.getElementById('kioskQrGroupBtn');
    const gBox = document.getElementById('kioskQrGroup');
    if (pBtn) {
      pBtn.addEventListener('click', () => {
        const selectedLines = (kioskState.selections || [])
          .slice()
          .sort((a, b) => a.year === b.year ? a.label.localeCompare(b.label) : a.year - b.year)
          .map(s => {
            const source = (events[s.year] || []).find(it => it.label === s.label) || { label: s.label, label_en: '' };
            const label = getPrimaryLabel(source) || s.label;
            return isEnglishUi() ? `${s.year}: ${label}` : `${s.year}年: ${label}`;
          });
        const textEncoder = new TextEncoder();
        const utf8Len = (s) => textEncoder.encode(String(s || '')).length;
        const clampUtf8 = (text, maxBytes) => {
          const src = String(text || '');
          if (maxBytes <= 0) return '';
          const bytes = textEncoder.encode(src);
          if (bytes.length <= maxBytes) return src;
          let i = maxBytes;
          while (i > 0 && (bytes[i - 1] & 0xC0) === 0x80) i--;
          return new TextDecoder('utf-8').decode(bytes.slice(0, i));
        };
        const MAX_QR_BYTES = 2800;
        const omitNote = isEnglishUi()
          ? '(Omitted below because it does not fit in the QR code)'
          : '（以下QRコードに入らないため省略しました）';
        const titleNickname = isEnglishUi() ? '[Nickname]\n' : '【ニックネーム】\n';
        const titleDiagnosis = isEnglishUi() ? '\n\n[Diagnosis Result]\n' : '\n\n【診断結果】\n';
        const titleChecked = isEnglishUi() ? '\n\n[Checked items]\n' : '\n\n【チェックした項目】\n';
        const diagnosisSection = titleDiagnosis + report;
        const buildCheckedBodyWithin = (limitBytes) => {
          if (limitBytes <= 0) return '';
          if (!selectedLines.length) return isEnglishUi() ? '(none)' : '（なし）';
          const head = isEnglishUi() ? `(${selectedLines.length} items)` : `（${selectedLines.length}件）`;
          const withAll = head + '\n' + selectedLines.join('\n');
          if (utf8Len(withAll) <= limitBytes) return withAll;
          const minWithOmit = head + '\n' + omitNote;
          if (utf8Len(minWithOmit) > limitBytes) return clampUtf8(omitNote, limitBytes);
          const acc = [];
          for (const line of selectedLines) {
            const next = head + '\n' + acc.concat(line).join('\n') + '\n' + omitNote;
            if (utf8Len(next) <= limitBytes) acc.push(line);
            else break;
          }
          let result = head + (acc.length ? '\n' + acc.join('\n') : '') + '\n' + omitNote;
          while (utf8Len(result) > limitBytes && acc.length) {
            acc.pop();
            result = head + (acc.length ? '\n' + acc.join('\n') : '') + '\n' + omitNote;
          }
          if (utf8Len(result) > limitBytes) return clampUtf8(omitNote, limitBytes);
          return result;
        };
        // 診断結果を先に確保し、可変の「チェックした項目」は最後に詰める。
        const fixedPrefix = titleNickname + nickname + diagnosisSection + titleChecked;
        if (utf8Len(fixedPrefix) > MAX_QR_BYTES) {
          openModalText(
            t('QR生成エラー', 'QR Generation Error'),
            t(
              '診断結果本文が長すぎるため、QRコードに収まりませんでした。項目選択状況を省略しても入りきりません。',
              'The diagnosis text is too long for a QR code. It does not fit even if checked items are omitted.'
            )
          );
          return;
        }
        const availableForChecked = MAX_QR_BYTES - utf8Len(fixedPrefix);
        const checkedBody = buildCheckedBodyWithin(Math.max(0, availableForChecked));
        const qrText = clampUtf8(fixedPrefix + checkedBody, MAX_QR_BYTES);
        let overlay = document.getElementById('kioskQrPersonalOverlay');
        if (overlay) overlay.remove();
        overlay = document.createElement('div');
        overlay.id = 'kioskQrPersonalOverlay';
        overlay.innerHTML = '<div class="kiosk-qr-img" style="color:#fff;font-size:18px;">' + t('QR生成中…', 'Generating QR...') + '</div><button type="button" class="kiosk-qr-close">' + t('閉じる', 'Close') + '</button>';
        overlay.querySelector('.kiosk-qr-close').addEventListener('click', () => overlay.remove());
        document.body.appendChild(overlay);
        const showQrOverlay = (dataUrl) => {
          const wrap = overlay.querySelector('.kiosk-qr-img');
          wrap.innerHTML = '';
          const img = document.createElement('img');
          img.src = dataUrl;
          img.alt = t('個人レポートQR', 'Personal report QR');
          wrap.appendChild(img);
        };
        const showError = (msg) => {
          const wrap = overlay.querySelector('.kiosk-qr-img');
          wrap.style.color = '#f88';
          wrap.textContent = msg || t('QRの生成に失敗しました', 'Failed to generate QR');
        };
        const runGenerate = () => {
          const qrSize = Math.min(520, Math.min(window.innerWidth, window.innerHeight) - 80);
          try {
            const Q = window.QRCode || window.qrcode || (typeof QRCode !== 'undefined' ? QRCode : null);
            if (!Q) {
              showError(t('QRライブラリが読み込めません', 'QR library could not be loaded'));
              return;
            }
            const canvas = document.createElement('canvas');
            const opts = { width: qrSize, margin: 2, errorCorrectionLevel: 'L' };
            if (typeof Q.toCanvas === 'function') {
              Q.toCanvas(canvas, qrText, opts, (err) => {
                if (err) {
                  showError(t('QRの生成に失敗しました', 'Failed to generate QR'));
                  console.error(err);
                  return;
                }
                try {
                  showQrOverlay(canvas.toDataURL('image/png'));
                } catch (e) { showError(t('画像の作成に失敗', 'Failed to create image')); console.error(e); }
              });
              return;
            }
            if (typeof Q.toDataURL === 'function') {
              const cb = (err, dataUrl) => {
                if (err) {
                  showError(t('QRの生成に失敗しました', 'Failed to generate QR'));
                  console.error(err);
                  return;
                }
                showQrOverlay(dataUrl);
              };
              try {
                const p = Q.toDataURL(qrText, opts);
                if (p && typeof p.then === 'function') p.then(showQrOverlay).catch((err) => { showError(t('QRの生成に失敗しました', 'Failed to generate QR')); console.error(err); });
                else Q.toDataURL(qrText, opts, cb);
              } catch (e1) {
                try { Q.toDataURL(qrText, { width: qrSize }, cb); } catch (e2) { showError(t('QRの生成に失敗しました', 'Failed to generate QR')); console.error(e2); }
              }
              return;
            }
            showError(t('QR APIが見つかりません', 'QR API not found'));
            return;
          } catch (e) {
            showError(t('QRの生成に失敗しました', 'Failed to generate QR'));
            console.error(e);
          }
        };
        if (window.QRCode || window.qrcode) {
          runGenerate();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js';
        script.crossOrigin = 'anonymous';
        script.onload = runGenerate;
        script.onerror = () => {
          const s2 = document.createElement('script');
          s2.src = 'https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js';
          s2.crossOrigin = 'anonymous';
          s2.onload = runGenerate;
          s2.onerror = () => showError(t('QRライブラリの読み込みに失敗しました', 'Failed to load QR library'));
          document.head.appendChild(s2);
        };
        document.head.appendChild(script);
      });
    }
    if (gBtn && gBox) {
      gBtn.addEventListener('click', () => {
        gBox.style.display = gBox.style.display === 'none' ? 'flex' : 'none';
      });
    }
  }

      if (containsAny(label, ['ゲーム','ファミコン','スーパーファミコン','ストリートファイター','ドラクエ','FF','ポケモン','パズドラ','モンハン'])) add(generalScores, 'gamefriendly', weight + 0.9);

    Object.keys(deepCounts).forEach((key) => {

    });
    Object.keys(generalCounts).forEach((key) => {
      const count = generalCounts[key] || 0;

    });

    // ブランド／文化圏クラスターの強制ブースト

    const unixClusterCount = moduleClusterCounts.unix_practical || 0;

    const vocaloidClusterCount = moduleClusterCounts.vocaloid_persona || 0;

    const anonClusterCount = moduleClusterCounts.anon_net || 0;

    const watchClusterCount = moduleClusterCounts.shared_viewing || 0;
    if (watchClusterCount >= 3) add(deepScores, 'watchalong', watchClusterCount >= 5 ? 14 : 8);

    const rankedDeep = Object.entries(deepScores).sort((a,b)=>b[1]-a[1]);
    const rankedGeneral = Object.entries(generalScores).sort((a,b)=>b[1]-a[1]);

    let lowerModuleLevel = 'none';
    let lowerModules = [];
    const deepBestKey = rankedDeep[0] ? rankedDeep[0][0] : '';
    const deepBest = rankedDeep[0] ? rankedDeep[0][1] : 0;
    const deepSecond = rankedDeep[1] ? rankedDeep[1][1] : 0;
    const generalBest = rankedGeneral[0] ? rankedGeneral[0][1] : 0;
    const deepBestCount = deepCounts[deepBestKey] || 0;
    const deepBestStrong = deepStrongCounts[deepBestKey] || 0;

    const shouldPreferDeep =
      (deepBestCount >= 3) ||
      (deepBestCount >= 2 && deepBestStrong >= 1) ||
      (deepBest >= 4.8 && deepBest >= (generalBest * 1.15)) ||
      (deepBest >= 9 && deepBest > generalBest);

    if (shouldPreferDeep) {
      lowerModuleLevel = 'deep';
      const secondThreshold = Math.max(2.4, deepBest * 0.45);
      lowerModules = rankedDeep
        .filter(([key, score], idx) => idx === 0 || score >= secondThreshold)
        .slice(0,2)
        .map(([key]) => MODE2_DEEP_LOWER_MODULES.find(m => m.key === key))
        .filter(Boolean)
        .map(info => ({ key: info.key, ja: info.ja, en: info.en, level: info.level }));
    } else if (generalBest >= 2.8) {
      lowerModuleLevel = 'general';
      lowerModules = rankedGeneral
        .slice(0,2)
        .map(([key]) => MODE2_GENERAL_LOWER_MODULES.find(m => m.key === key))
        .filter(Boolean)
        .map(info => ({ key: info.key, ja: info.ja, en: info.en, level: info.level }));
    }

    const practiceModes = Object.entries(practiceScores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([key]) => {
      const info = MODE2_PRACTICE_MODES.find(m => m.key === key);
      return info ? { key, ja: info.ja, en: info.en } : null;
    }).filter(Boolean);
    const fragments = labelsForFragments.sort((a,b)=>b.score-a.score).slice(0,2).map(x => x.label);
    return { lowerModules, lowerModuleLevel, practiceModes, fragments };
  }

  function stripCodeFences(s) {
    const src = String(s || '').trim();
    const m = src.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/i);
    return m ? m[1].trim() : src;
  }

  function parseMode2AiJson(text) {
    const raw = stripCodeFences(text);
    try { return JSON.parse(raw); } catch (_) {}
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start >= 0 && end > start) {
      try { return JSON.parse(raw.slice(start, end + 1)); } catch (_) {}
    }
    throw new Error('AI response is not valid JSON');
  }

  async function fetchDiagnosisFromConfiguredProvider(prompt, options) {
    const opts = options || {};

        const hasText = !!(result && result.ok && typeof result.text === 'string' && result.text.trim());
        if (hasText) return result;
        if (result && result.error) lastError = result.error;
        else lastError = 'OpenAI backend returned empty response.';
      }

    }
    const cfr = getCfrPrompts();
    const provider = ((cfr.aiProvider || DEFAULT_CFR_PROMPTS.aiProvider || 'gemini') + '').toLowerCase();
    const retryProvider = async (which, maxAttempts) => {
      let lastError = '';
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        const result = which === 'gemini' ? await callGeminiViaBackend(prompt) : await callOpenAiViaBackend(prompt);
        const hasText = !!(result && result.ok && typeof result.text === 'string' && result.text.trim());
        if (hasText) return result;
        if (result && result.error) lastError = result.error;
        else lastError = which.toUpperCase() + ' backend returned empty response.';
      }
      return { ok: false, error: lastError || 'Unknown error' };
    };
    const primary = (provider === 'openai') ? 'openai' : 'gemini';
    const secondary = (primary === 'gemini') ? 'openai' : 'gemini';

    pBtn.addEventListener('click', () => {
      const nickname = normalizeKioskNickname(kioskState.nickname || '');
      const selectedLines = (kioskState.selections || []).slice().sort((a,b) => a.year === b.year ? String(a.label || '').localeCompare(String(b.label || '')) : a.year - b.year).map(s => {
        const source = getKioskSourceItem(s) || s;
        return `${s.year}年: ${getPrimaryLabel(source)}`;
      });
      const textEncoder = new TextEncoder();
      const utf8Len = (s) => textEncoder.encode(String(s || '')).length;
      const clampUtf8 = (text, maxBytes) => {
        const src = String(text || '');
        if (maxBytes <= 0) return '';
        const bytes = textEncoder.encode(src);
        if (bytes.length <= maxBytes) return src;
        let i = maxBytes;
        while (i > 0 && (bytes[i - 1] & 0xC0) === 0x80) i--;
        return new TextDecoder('utf-8').decode(bytes.slice(0, i));
      };
      const MAX_QR_BYTES = 2800;
      const omitNote = '（以下QRコードに入らないため省略しました）';
      const fullReport = typeof reportOrResult === 'string'
        ? reportOrResult
        : mode2ValueToText(reportOrResult && reportOrResult.resultText, '');
      const compactReport = typeof reportOrResult === 'object'
        ? buildMode2CompactQrReport(reportOrResult)
        : fullReport;
      const reportCandidates = [fullReport];
      if (compactReport && compactReport !== fullReport) reportCandidates.push(compactReport);

      const buildCheckedBodyWithin = (available) => {
        if (available <= 0) return '';
        let checkedBody = '（' + selectedLines.length + '件）\n' + selectedLines.join('\n');
        if (utf8Len(checkedBody) <= available) return checkedBody;
        checkedBody = '（' + selectedLines.length + '件）\n';
        const acc = [];
        for (const line of selectedLines) {
          const next = '（' + selectedLines.length + '件）\n' + acc.concat(line).join('\n') + '\n' + omitNote;
          if (utf8Len(next) <= available) acc.push(line); else break;
        }
        return '（' + selectedLines.length + '件）\n' + acc.join('\n') + '\n' + omitNote;
      };

      let qrText = '';
      for (const report of reportCandidates) {
        const fixedPrefix = '【ニックネーム】\n' + nickname + '\n\n【診断結果】\n' + report + '\n\n【チェックした項目】\n';
        if (utf8Len(fixedPrefix) > MAX_QR_BYTES) continue;
        const available = MAX_QR_BYTES - utf8Len(fixedPrefix);
        const checkedBody = buildCheckedBodyWithin(available);
        qrText = clampUtf8(fixedPrefix + checkedBody, MAX_QR_BYTES);
        if (qrText) break;
      }
      if (!qrText) {
        openModalText('QR生成エラー', '診断結果本文が長すぎるため、QRコードに収まりませんでした。短縮版も試しましたが入りませんでした。');
        return;
      }
      let overlay = document.getElementById('kioskQrPersonalOverlay');
      if (overlay) overlay.remove();
      overlay = document.createElement('div');
      overlay.id = 'kioskQrPersonalOverlay';
      overlay.innerHTML = '<div class="kiosk-qr-img" style="color:#fff;font-size:18px;">QR生成中…</div><button type="button" class="kiosk-qr-close">閉じる</button>';
      overlay.querySelector('.kiosk-qr-close').addEventListener('click', () => overlay.remove());
      document.body.appendChild(overlay);
      const showQrOverlay = (dataUrl) => {
        const wrap = overlay.querySelector('.kiosk-qr-img');
        wrap.innerHTML = '';
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = '個人レポートQR';
        wrap.appendChild(img);
      };
      const showError = (msg) => {
        const wrap = overlay.querySelector('.kiosk-qr-img');
        wrap.style.color = '#f88';
        wrap.textContent = msg || 'QRの生成に失敗しました';
      };
      const runGenerate = () => {
        const qrSize = Math.min(520, Math.min(window.innerWidth, window.innerHeight) - 80);
        try {
          const Q = window.QRCode || window.qrcode || (typeof QRCode !== 'undefined' ? QRCode : null);
          if (!Q) return showError('QRライブラリが読み込めません');
          const canvas = document.createElement('canvas');
          const opts = { width: qrSize, margin: 2, errorCorrectionLevel: 'L' };
          if (typeof Q.toCanvas === 'function') {
            Q.toCanvas(canvas, qrText, opts, (err) => {
              if (err) return showError('QRの生成に失敗しました');
              try { showQrOverlay(canvas.toDataURL('image/png')); } catch (_) { showError('画像の作成に失敗'); }
            });
            return;
          }
          if (typeof Q.toDataURL === 'function') {
            const p = Q.toDataURL(qrText, opts);
            if (p && typeof p.then === 'function') p.then(showQrOverlay).catch(() => showError('QRの生成に失敗しました'));
            return;
          }
          showError('QR APIが見つかりません');
        } catch (_) { showError('QRの生成に失敗しました'); }
      };
      if (window.QRCode || window.qrcode) return runGenerate();
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js';
      script.crossOrigin = 'anonymous';
      script.onload = runGenerate;
      script.onerror = () => showError('QRライブラリの読み込みに失敗しました');
      document.head.appendChild(script);
    });
  }

  const formatSessionRow = (ses, idx, formatDate) => {
    const nickText = (ses.nickname != null && ses.nickname !== '') ? (String(ses.nickname).replace(/</g, '&lt;')) : '—';
    const genderText = (ses.gender != null && ses.gender !== '') ? ses.gender : '—';
    const birthYearText = (ses.birthYear != null && ses.birthYear !== '') ? (isEnglishUi() ? (ses.birthYear + '') : (ses.birthYear + '年生')) : '—';
    const lines = (ses.selections || []).map(s => {
      const jaRaw = String(s && s.label ? s.label : '');
      let enRaw = String((s && (s.label_en || s.enLabel)) ? (s.label_en || s.enLabel) : '');
      if (!enRaw && s && s.year != null && jaRaw) {
        const arr = events[s.year] || [];
        const item = arr.find(it => it.label === jaRaw) || null;
        if (item && item.label_en) enRaw = String(item.label_en);
      }
      const ja = jaRaw.replace(/</g, '&lt;');
      const en = enRaw.replace(/</g, '&lt;');
      let labelHtml = ja || en;
      if (ja && en && ja !== en) {
        labelHtml = `${ja} <span style="color:#666;">/ ${en}</span>`;
      }
      return isEnglishUi() ? `${s.year}: ${labelHtml}` : `${s.year}年: ${labelHtml}`;
    }).join('<br>');

      ? `<div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #eee;"><strong>${idx + 1}. ${formatDate(ses.timestamp)}</strong> Nickname: ${nickText} / Gender: ${genderText} / Birth year: ${birthYearText} (${(ses.selections || []).length} selected)<br><span style="color:#444;">${lines || '(none)'}</span></div>`

    openModal(usageTitle, html, { footer: 'none' });
    const startBtn = document.getElementById('kioskUsageStartBtn');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        closeModal(); // closeModal 経由で resetKioskToStart が呼ばれて先頭画面へ
      });
    }
  }

  function resetKioskToStart() {
    setUiLanguage(defaultUiLanguage);
    // 状態リセット
    kioskState.step = 0;
    kioskState.selections = [];
    kioskState.selectionMeanings = {};
    kioskState.nickname = '';
    kioskState.eventYearMoved = false;
    kioskState.showLowerOverlay = false;
    kioskState.step3StartedOperating = false;
    kioskState.step3ChecklistActivated = false;
    document.body.classList.remove('kiosk-step3-compact-hint');
    // チェック状態クリア
    if (typeof probeCheckedKeys !== 'undefined' && probeCheckedKeys.clear) {
      probeCheckedKeys.clear();
    }
    if (typeof lastProbeEventYear !== 'undefined') {
      lastProbeEventYear = null;
    }
    if (probeEventsPanel) {
      probeEventsPanel.style.display = 'none';
      probeEventsPanel.innerHTML = '';
    }
    const hint = document.getElementById('kioskHint');
    if (hint) hint.style.display = 'none';
    const stepEl = document.getElementById('kioskStepOverlay');
    if (stepEl) stepEl.style.display = 'none';
    // ジャンル選択をリセット
    selectedGenres.clear();
    updateGenreFilterButtonText && updateGenreFilterButtonText();
    renderEvents();
    // 最初のオーバーレイを再表示（必要なら CFR プロンプト設定を読み込んでから）
    try {
      ensureCfrPromptsLoaded().then(() => {
        applyConfiguredBlueProbeYears();
        openKioskStartOverlay();
      });
    } catch (_) {
      openKioskStartOverlay();
    }
  }
  window.resetKioskToStart = resetKioskToStart;

  (async function setupKioskFlow(){
    if (!window.kioskMode) return;
    // CFR プロンプト設定を先に読み込んでからスタートオーバーレイを表示
    try {
      await ensureCfrPromptsLoaded();
    } catch (_) {}
    applyConfiguredBlueProbeYears();
    openKioskStartOverlay();
    const hintBox = ensureKioskHint();
    const nextBtn = hintBox.querySelector('#kioskNextBtn');
    const finishBtn = hintBox.querySelector('#kioskFinishBtn');
    const restartBtn = hintBox.querySelector('#kioskRestartBtn');
    const yearUpBtn = hintBox.querySelector('#kioskYearUpBtn');
    const yearDownBtn = hintBox.querySelector('#kioskYearDownBtn');
    // 「次へ」はステップ遷移には使わない（常に非表示）
    nextBtn.addEventListener('click', () => {});
    finishBtn.addEventListener('click', () => {
      if (kioskState.step === 3 && kioskState.selections.length >= getKioskDiagnosisMinCount()) {
        showKioskSelectionsSummary();
      }
    });
    if (restartBtn) {
      restartBtn.addEventListener('click', async () => {
        try {
          const ok = (typeof window.confirmRestartToStart === 'function') ? await window.confirmRestartToStart() : false;
          if (!ok) return;
          resetKioskToStart();
        } catch (_) {}
      });
    }
    if (yearUpBtn) {
      yearUpBtn.addEventListener('click', () => {
        if (typeof probeBlue === 'undefined') return;
        if (window.kioskState) window.kioskState.step3ChecklistActivated = true;
        if (window.kioskState) { window.kioskState.showLowerOverlay = false; if (typeof window.updateKioskStepOverlay === 'function') window.updateKioskStepOverlay(); }
        probeBlue.eventYear = Math.min(YEAR_MAX, probeBlue.eventYear + 1);
        probeBlue.redraw();
        if (isMobileLikeViewport() && typeof window.scrollProbeEventYearIntoView === 'function') window.scrollProbeEventYearIntoView();
        if (typeof window.updateProbeEventsPanel === 'function') window.updateProbeEventsPanel(probeBlue.eventYear);
      });
    }
    if (yearDownBtn) {
      yearDownBtn.addEventListener('click', () => {
        if (typeof probeBlue === 'undefined') return;
        if (window.kioskState) window.kioskState.step3ChecklistActivated = true;
        if (window.kioskState) { window.kioskState.showLowerOverlay = false; if (typeof window.updateKioskStepOverlay === 'function') window.updateKioskStepOverlay(); }
        probeBlue.eventYear = Math.max(YEAR_MIN, probeBlue.eventYear - 1);
        probeBlue.redraw();
        if (isMobileLikeViewport() && typeof window.scrollProbeEventYearIntoView === 'function') window.scrollProbeEventYearIntoView();
        if (typeof window.updateProbeEventsPanel === 'function') window.updateProbeEventsPanel(probeBlue.eventYear);
      });
    }
    // 右側チェックリストに一本化したため、マウスアップ時のチェックリストモーダルは使用しない
  })();
